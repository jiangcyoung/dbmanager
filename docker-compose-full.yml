services:
  # DB Manager 主服务
  dbmanager:
    build: .
    container_name: dbmanager
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - TZ=Asia/Shanghai
    volumes:
      - dbmanager_data:/app/data
    restart: unless-stopped
    networks:
      - db-network
    depends_on:
      - mysql
      - postgres
      - mongo
      - redis

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: dbmanager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: testdb
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpass123
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - db-network
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: dbmanager-postgres
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpass123
      POSTGRES_DB: testdb
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - db-network

  # MongoDB
  mongo:
    image: mongo:7
    container_name: dbmanager-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123456
      MONGO_INITDB_DATABASE: testdb
      TZ: Asia/Shanghai
    ports:
      - "37017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - db-network
    command: mongod --auth

  # Redis
  redis:
    image: redis:7-alpine
    container_name: dbmanager-redis
    environment:
      TZ: Asia/Shanghai
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - db-network
    command: redis-server --appendonly yes --requirepass redispass123

volumes:
  dbmanager_data:
  mysql_data:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  db-network:
    driver: bridge
